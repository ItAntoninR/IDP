version: 1
metadata:
  name: auth-service (local development)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  - model: authentik_core.group
    id: staff
    identifiers:
      name: staff
    attrs:
      name: staff

  - model: authentik_core.user
    identifiers:
      username: staff
    attrs:
      username: staff
      name: Staff Local
      email: staff@authentik.local
      password: staff-password-123
      is_active: true
      groups:
        - !KeyOf staff

  - model: authentik_core.user
    identifiers:
      username: outsider
    attrs:
      username: outsider
      name: Outsider Local
      email: outsider@authentik.local
      password: outsider-password-123
      is_active: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: auth-service
    attrs:
      name: auth-service
      client_type: confidential
      client_id: auth-service-local
      client_secret: auth-service-local-secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/api/auth/callback/authentik
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: auth-service
    attrs:
      name: Auth service
      slug: auth-service
      provider: !KeyOf provider
      meta_launch_url: http://localhost:3000/sign-in?provider=authentik
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf staff
    attrs:
      order: 0
